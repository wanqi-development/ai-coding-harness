# 模型提供商目录 —— **新库的初始快照**（2026-10-15 起）。
#
# **平时不要改这个文件**：目录在设置页第 4 栏「提供商」里改（改完刷新界面即生效，不用重启）。
# 本文件只在**表为空**（新库 / 换台机器）时灌一次；要按它重新对齐表走
# `POST /model-config/providers/reload`（同名行整行覆盖，表里多出来的行不动）。
#
# 2026-10-14：地址与模型名按 `config/20261014161953.md`（各家 OpenAI 兼容口径的清单）填。
#   **该文件没给地址的，这里留空并标 TODO —— 不猜地址，猜错就是 404。**
#   地址与模型名是**会过期**的静态数据（那份清单自己也这么提醒），接入前以厂商官方文档为准。
#
# 字段说明（每个 [[provider]] 一节）：
#   provider             必填。稳定键，只能用小写字母/数字/下划线；界面选它 → 带出下面这个地址
#   display_name         必填。界面显示名（中文随便写）
#   default_base_url     选它时带出的地址（可改；留空 = 要用户自己填）
#   ui_group             下拉里的分组名（同组排在一起）；留空 = 不分组
#   sort_order           组内排序，小的在前
#   status               1 = 启用（默认）；0 = 停用（界面上不出现）
#   is_dynamic_model_list  **纯标注位**：这家官方有没有 /models 接口（true / false）。
#                          它**不再**影响界面或探测 —— 「测试连接」能不能点只看「地址 + key」。
#   models_path          「测试连接」拉列表的路径（默认 /models；有的网关不一样）
#   auth_header/auth_prefix  鉴权头怎么写（默认 Authorization + "Bearer "；有的网关是 x-api-key）
#
# 一句话：**模型名以「刷新清单」拉到的那份为准**（落表 provider_models）；拉不到就老实说拉不到，
# 界面上手填。2026-10-15 删掉了「内置候选」（default_models）—— 那份静态名单会过期，
# 和刷新到的实时清单重复。

# ============================== 国内厂商 ==============================

[[provider]]
provider = "deepseek"
display_name = "DeepSeek"
default_base_url = "https://api.deepseek.com"
ui_group = "国内厂商"
sort_order = 10
is_dynamic_model_list = true

[[provider]]
provider = "qwen"
display_name = "Qwen（阿里百炼）"
# TODO 源文件没给地址（只在正文里提到百炼平台）：这里取百炼的 OpenAI 兼容入口，请核对
default_base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
# 模型清单**不在**上面那个根下面（2026-10-15 用户实测）：百炼的清单在原生入口
# https://dashscope.aliyuncs.com/api/v1/models，而且窗口埋在 output.models[].model_info.context_window。
# models_path 允许写**绝对地址**（见 routes/model_config._fetch_models_payload）。
models_path = "https://dashscope.aliyuncs.com/api/v1/models"
ui_group = "国内厂商"
sort_order = 20
is_dynamic_model_list = true

[[provider]]
provider = "glm"
display_name = "GLM（智谱）"
default_base_url = "https://open.bigmodel.cn/api/paas/v4/"
# 清单在**多一层 /v1** 上（2026-10-15 用户实测）：`…/api/paas/v4/models` 只回模型名，
# `…/api/paas/v4/v1/models` 才带 context_length。
models_path = "/v1/models"
ui_group = "国内厂商"
sort_order = 30
is_dynamic_model_list = true

