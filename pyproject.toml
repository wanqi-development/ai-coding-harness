[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-coding-harness"
version = "0.1.0"
description = "Coding-assist harness built on deepagents with standalone WSL and multi-worker sandbox profiles"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # **这两个必须钉住**：我们按类排掉了 deepagents 自带的压缩中间件、自己构造了一份，
    # 还依赖 langchain 摘要中间件的若干取值语义。`requirements.txt` 早就钉了，但
    # `pip install -e ".[dev]"` 是按**这份**重装依赖的（AGENTS.md 记着这个坑）——
    # 这里不钉，一次重装就可能把它们抬到新版而让上面那套静默失效。
    "deepagents>=0.6.11,<0.7",
    "langchain>=1.4.0,<2",
    # **钉住**：``agent/chat_model.py`` 覆写了 ChatOpenAI 的流式 chunk 转换
    # （补第三方网关的 ``reasoning_content``），私有钩子跨 minor 可能变。
    # 升级时先跑 ``tests/test_chat_model.py``。
    "langchain-openai>=1.3.2,<1.4",
    "langgraph",
    "langgraph-checkpoint-postgres",
    "langgraph-checkpoint-sqlite",
    "aiosqlite",
    "psycopg[binary]",
    # 多 worker 时的跨进程旁路状态（运行缓冲 / 会话运行权 / 熔断状态）。
    # 不配 REDIS_URL 时用不到它 —— 代码里是懒 import，单 worker 部署照旧跑。
    "redis>=5.0",
    "cryptography>=42",
    "sqlalchemy[asyncio]",
    "alembic",
    "fastapi",
    "uvicorn[standard]",
    "sse-starlette",
    "pydantic-settings",
    "opensandbox",
    "httpx",
    "markdownify",
    "beautifulsoup4",
    "zai-sdk",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_coding_harness"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
